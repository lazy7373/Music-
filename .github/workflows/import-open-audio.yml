name: Import openly licensed music

on:
  workflow_dispatch:
    inputs:
      max_tracks:
        description: "Maximum total tracks to keep in this archive"
        required: false
        default: "900"
  push:
    paths:
      - ".github/workflows/import-open-audio.yml"
      - "scripts/import_open_audio.py"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download licensed MP3s
        env:
          MAX_TRACKS: ${{ inputs.max_tracks || '900' }}
        run: python scripts/import_open_audio.py
      - name: Commit MP3s and attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/open-library licenses/open-library-attribution.jsonl
          git diff --cached --quiet || git commit -m "Import openly licensed MP3 collection"
          git push
